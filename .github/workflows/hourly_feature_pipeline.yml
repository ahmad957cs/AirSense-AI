name: AirSense-AI Hourly Feature Pipeline

on:
  workflow_dispatch:

  schedule:
    # Every hour at minute 17, UTC.
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  hourly-feature-pipeline:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      OPENAQ_SENSOR_ID: "13137731"

      HOPSWORKS_HOST: eu-west.cloud.hopsworks.ai
      HOPSWORKS_PROJECT: AirSense_AI
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}

      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify production environment
        run: |
          python - <<'PY'
          import os

          required = [
              "OPENAQ_API_KEY",
              "HOPSWORKS_API_KEY",
              "HOPSWORKS_HOST",
              "HOPSWORKS_PROJECT",
              "OPENAQ_SENSOR_ID",
          ]

          missing = [
              name for name in required
              if not os.getenv(name)
          ]

          if missing:
              raise RuntimeError(
                  f"Missing required environment variables: {missing}"
              )

          print("Production environment variables are present.")
          print("Sensor ID:", os.environ["OPENAQ_SENSOR_ID"])
          print("Hopsworks project:", os.environ["HOPSWORKS_PROJECT"])
          PY

      - name: Run hourly feature pipeline
        run: |
          python -m scripts.pipeline.run_hourly_feature_pipeline