name: AirSense-AI Hourly Feature Pipeline

on:
  workflow_dispatch:

  schedule:
    # Every hour at minute 17 UTC
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  hourly-feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      OPENAQ_SENSOR_ID: ${{ secrets.OPENAQ_SENSOR_ID }}

      HOPSWORKS_HOST: eu-west.cloud.hopsworks.ai
      HOPSWORKS_PROJECT: AirSense_AI
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}

      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install hourly pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Verify production environment
        run: |
          python - <<'PY'
          import os

          required = [
              "OPENAQ_API_KEY",
              "HOPSWORKS_API_KEY",
              "HOPSWORKS_HOST",
              "HOPSWORKS_PROJECT",
              "OPENAQ_SENSOR_ID",
          ]

          missing = [
              name
              for name in required
              if not os.getenv(name)
          ]

          if missing:
              raise RuntimeError(
                  f"Missing required environment variables: {missing}"
              )

          print("Required environment variables are present.")
          print("OpenAQ sensor:", os.environ["OPENAQ_SENSOR_ID"])
          print("Hopsworks project:", os.environ["HOPSWORKS_PROJECT"])
          print("OpenAQ key length:", len(os.environ["OPENAQ_API_KEY"]))
          print("Hopsworks key length:", len(os.environ["HOPSWORKS_API_KEY"]))
          PY

      - name: Validate OpenAQ credentials
        run: |
          python - <<'PY'
          import os
          import requests

          api_key = os.environ["OPENAQ_API_KEY"]
          sensor_id = os.environ["OPENAQ_SENSOR_ID"]

          print("GitHub OpenAQ key present:", bool(api_key))
          print("GitHub OpenAQ key length:", len(api_key))
          print("OpenAQ sensor:", sensor_id)

          url = (
              f"https://api.openaq.org/v3/"
              f"sensors/{sensor_id}/hours"
          )

          response = requests.get(
              url,
              headers={"X-API-Key": api_key},
              params={
                  "datetime_from": "2026-08-23T00:00:00Z",
                  "datetime_to": "2026-08-23T03:00:00Z",
                  "limit": 10,
                  "page": 1,
              },
              timeout=30,
          )

          print("OpenAQ HTTP status:", response.status_code)

          if response.status_code != 200:
              raise RuntimeError(
                  f"OpenAQ request failed: HTTP {response.status_code}"
              )

          print("OpenAQ request successful.")
          print(
              "Records returned:",
              len(response.json().get("results", []))
          )
          PY

      - name: Run hourly feature pipeline
        run: |
          python -m scripts.pipeline.run_hourly_feature_pipeline
